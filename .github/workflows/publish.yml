name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; staged publishing needs >= 11.15.0
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      - name: Check whether this version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify
        if: steps.check.outputs.publish == 'true'
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Stage release on npm
        if: steps.check.outputs.publish == 'true'
        # Authenticates via OIDC (npm trusted publisher, stage-publish permission).
        # The version only goes live after a maintainer approves it with 2FA:
        # `npm stage approve <stage-id>` or the Staged Packages tab on npmjs.com.
        # Needs npm >= 11.15.0.
        run: npm stage publish
