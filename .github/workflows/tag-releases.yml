name: Tag releases

# Tags every package version that is live on npm as <name>@<version> (e.g. @campfhir/hl7@0.11.0),
# so git tags always line up with the registry. Staged releases are approved outside GitHub,
# hence the schedule.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: tag-releases
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: node .github/scripts/tag-releases.mjs
